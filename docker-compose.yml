services:
  db:
    image: postgres:15-alpine
    container_name: timesheet-db
    shm_size: 1gb
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      TZ: ${TIMEZONE}
      PGTZ: ${TIMEZONE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - timesheet-network

  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: timesheet-api
    expose:
      - "3001"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PORT=${PORT}
      - NODE_ENV=${NODE_ENV}
      - PLANT_SSB=${PLANT_SSB}
      - TIMEZONE=${TIMEZONE}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - TZ=${TIMEZONE}
      - SAP_INBOUND_URL=${SAP_INBOUND_URL}
      - SAP_INBOUND_USERNAME=${SAP_INBOUND_USERNAME}
      - SAP_INBOUND_PASSWORD=${SAP_INBOUND_PASSWORD}
      - ID_TIMESHEET=${ID_TIMESHEET}
      - TGT_TABLE=${TGT_TABLE}
      - SQLSERVER_HOST=${SQLSERVER_HOST}
      - SQLSERVER_PORT=${SQLSERVER_PORT}
      - SQLSERVER_DATABASE=${SQLSERVER_DATABASE}
      - SQLSERVER_USER=${SQLSERVER_USER}
      - SQLSERVER_PASSWORD=${SQLSERVER_PASSWORD}
    volumes:
      - ./API/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - timesheet-network

  frontend:
    build:
      context: ./react-timesheet
      args:
        VITE_API_URL: /api
        VITE_TTS_API_URL: ""
        VITE_APP_VARIANT: ${VITE_APP_VARIANT:-salvaging}
    container_name: timesheet-frontend
    expose:
      - "80"
    environment:
      - TZ=${TIMEZONE}
    restart: unless-stopped
    networks:
      - timesheet-network

  nginx:
    image: nginx:alpine
    container_name: timesheet-nginx
    environment:
      - TZ=${TIMEZONE}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./API/uploads:/uploads:ro
    depends_on:
      - api
      - frontend
      - fastapi
    restart: unless-stopped
    networks:
      - timesheet-network

  sow_exporter:          
    build:
      context: ./pythonscript
      dockerfile: Dockerfile
    container_name: sow-exporter
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - ./export:/data/export
      - ./pythonscript:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - timesheet-network

  fastapi:
    build:
      context: ./API/FastAPI
      dockerfile: Dockerfile
    container_name: fastapi
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PORTFLASK=8000
      - TTS_UPLOAD_ROOT=/app/uploads
    volumes:
      - ./API/uploads:/app/uploads
    networks:
      - timesheet-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tts-worker:
    build:
      context: ./TTS Service
      dockerfile: Dockerfile
    container_name: tts-worker
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - TTS_UPLOAD_ROOT=/uploads
      - TTS_SERVICE_DIR=/app
      - PIPER_BIN=piper
      - PIPER_MODEL_PATH=/app/models/id_ID.onnx
      - PIPER_CONFIG_PATH=/app/models/id_ID.onnx.json
      - PIPER_TIMEOUT_SECONDS=30
      - TTS_WORKER_POLL_SECONDS=3
      - TTS_WORKER_STUCK_SECONDS=120
      - TTS_WORKER_MAX_ATTEMPTS=3
    volumes:
      - ./TTS Service:/app
      - ./API/uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - timesheet-network



volumes:
  postgres_data:
    driver: local
networks:
  timesheet-network:
    driver: bridge
