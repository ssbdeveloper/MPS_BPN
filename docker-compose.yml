services:
  db:
    image: postgres:15-alpine
    container_name: timesheet-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      TZ: ${TIMEZONE}
      PGTZ: ${TIMEZONE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./database/init_database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/migrate_sow_to_parts.sql:/docker-entrypoint-initdb.d/02-migrate.sql:ro
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - timesheet-network

  api:
    build: ./API
    container_name: timesheet-api
    expose:
      - "3001"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PORT=${PORT}
      - NODE_ENV=${NODE_ENV}
      - PLANT_SSB=${PLANT_SSB}
      - TIMEZONE=${TIMEZONE}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - TZ=${TIMEZONE}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - timesheet-network

  frontend:
    build: ./react-timesheet
    container_name: timesheet-frontend
    expose:
      - "80"
    environment:
      - TZ=${TIMEZONE}
    restart: unless-stopped
    networks:
      - timesheet-network

  nginx:
    image: nginx:alpine
    container_name: timesheet-nginx
    environment:
      - TZ=${TIMEZONE}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    networks:
      - timesheet-network

  sow_exporter:          
    build:
      context: .
      dockerfile: pythonscript/Dockerfile
    container_name: sow-exporter
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - ./export:/data/export
      - ./pythonscript:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - timesheet-network

  fastapi:
    build: .
    ports:
      - "8000:8000"  
    networks:
      - timesheet-network


volumes:
  postgres_data:
    driver: local

networks:
  timesheet-network:
    driver: bridge
