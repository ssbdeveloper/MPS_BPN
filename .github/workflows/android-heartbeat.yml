name: Build MPS Heartbeat APK

on:
  push:
    branches: ["2b", "main"]
    paths: ["apps/mobile/**", ".github/workflows/android-heartbeat.yml"]
  workflow_dispatch: {}   # bisa dipicu manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: apps/mobile
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mps-heartbeat-debug-apk
          path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
