events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

  client_max_body_size 100M;

  upstream api_backend {
    server timesheet-api:3001;
  }


  upstream frontend_app {
    server timesheet-frontend:80;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # API routes
    location ~ ^/(usernfc|workcenter|timesheet|sow|process-category|process-parameter|process-parameter-choicebase|process-control|process-control-item)(/.*)?$ {
      proxy_pass http://api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }



location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
  proxy_pass http://frontend_app;
  expires 6M;
  access_log off;
  add_header Cache-Control "public";
}

location /sw.js {
  proxy_pass http://frontend_app;
  add_header Cache-Control "no-cache";
}

location /manifest.webmanifest {
  proxy_pass http://frontend_app;
}

    # ===== END STREAMLIT =====

    # React Frontend App (Proxy to frontend container)
    location / {
      proxy_pass http://frontend_app;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Support for React Router (SPA)
      proxy_intercept_errors on;
      error_page 404 = @frontend;
    }

    location @frontend {
      proxy_pass http://frontend_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}